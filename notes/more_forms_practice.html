<html>
    <head>
    </head>
    <body>
        <form action="#"></form>
        <fieldset>
            <legend>Username:</legend>
            <label for="username"></label>
            <input type="text" name="username" />
            <br/>
            <p>Password:</p>
            <label for="password"></label>
            <input type="password" name="password" />
            <br/>
        </fieldset>
        <fieldset>
            <p>Choose Shipping</p>
            <label for="shipping"></label>
            <br/>
            <input type="radio" name="shipping" value="ground" />Ground (5-7 Days)<br/>
            <input type="radio" name="shipping" value="2-Day" />2-Day<br/>
            <input type="radio" name="shipping" value="Next Day Air" />Next Day Air<br/>
        </fieldset>
        <fieldset>
            <p>Choose all sypmtoms that apply:</p>
            <labe for="symptoms"></labe><br/>
            <imput type="checkbox" name="symptoms" value="sneezing"/>Sneezing<br/>
            <input type="checkbox" name="symptoms" value="coughing"/>Coughing<br/>
            <input type="checkbox" name="symptoms" value="stomachpain"/>Stomach Pain<br/>
            <input type="checkbox" name="symptoms" value="sorethroat"/>Sore Throat<br/>
        </fieldset>
        <fieldset>
            <legend>Select your state</legend>
            <label for="state"></label>
            <select name="state">
                <option>WV</option>
                <option>OH</option>
                <option>VA</option>
                <option>MD</option>
                <option>KY</option>
                <option>PA</option>
            </select>
        </fieldset>
        <fieldset>
            <p>Please upload your resume:</p>
            <input type="file" name="resume" />

            <p>Please provide feedback</p>
            <textarea name="feedback" rows="4" cols="50">Please type here...</textarea>

            <p><input type="submit" value="submit" /></p>
        </fieldset>

        <br/><br />

        <input type="image" src="" alt="submit" />

    </body>
</html>
