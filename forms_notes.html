[       ] - Text Box
<input type="" name="username" />

[       ] - Password
<input type="password" name="password" />

O - Radio Button
<input type="radio" name="shipping" value="ground" />

[ ] - Checkboxes
<input type="checkbox" name="symptoms" value="sneezing" />

[SELECT \/] - Dopdown Select Box
<select name="name">
    <option>item 1</option>
    <option>Item 2</option>
</select>

[Browse] - File Upload
<imput type="file" name="resume" />

*Large Box* - Text Area
<textarea name="comments" rows="4" cols="50">
    Please leave a comment
</textarea>

[Submit] - Submit Button
<input type="submit" value="CLICK HERE" />

FORM TAGS

-At the beggining of a form you use:

<form action="####">
-At the end of your form
</form>
